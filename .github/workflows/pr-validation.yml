name: PR validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'charts/**'
      - 'docker/**'
      - '.github/config/**'
      - '.github/workflows/pr-validation.yml'

jobs:
  paths:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.matrix.outputs.charts }}
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          charts="$(jq -c --arg changed "$changed" '
            ($changed | split("\n")) as $files |
            [.[] | .path as $path | select(any($files[]; startswith($path + "/")))]
            | map({name, path})' .github/config/charts.json)"
          images="$(jq -c --arg changed "$changed" '
            ($changed | split("\n")) as $files |
            [.[] | .context as $context | select(any($files[]; startswith($context + "/")))]
            | map({name, context, dockerfile})' .github/config/images.json)"
          echo "charts=$charts" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  lint:
    needs: paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/chart-testing-action@v2.7.0
      - name: Lint changed charts
        run: ct lint --config ct.yaml --check-version-increment=false
      - uses: azure/setup-helm@v5
      - name: Validate rendered manifests
        run: |
          helm dependency build charts/webapp
          for chart in charts/filesender charts/webcomponent charts/webapp; do
            helm template "$chart" \
              --set ingress.enabled=false \
              --set postgresql.internal.enabled=false \
              --set postgres.enabled=false \
              --set mongodb.enabled=false |
              docker run --rm -i ghcr.io/yannh/kubeconform:latest -strict -summary
          done

  install:
    needs: paths
    if: contains(needs.paths.outputs.charts, 'filesender') || contains(needs.paths.outputs.charts, 'webcomponent') || contains(needs.paths.outputs.charts, 'webapp')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.12.0
      - uses: azure/setup-helm@v5
      - name: Build and install supported charts
        run: |
          helm dependency build charts/webapp
          helm install filesender charts/filesender --set ingress.enabled=false --set postgresql.internal.enabled=false
          helm install webcomponent charts/webcomponent --set ingress.enabled=false
          helm install webapp charts/webapp --set ingress.enabled=false --set postgres.enabled=false --set mongodb.enabled=false

  images:
    needs: paths
    if: needs.paths.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJSON(needs.paths.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: false

  release-gate:
    if: startsWith(github.event.pull_request.title, 'chore(main): release webapp')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - name: Resolve stable dependencies only
        run: |
          helm dependency build charts/webapp
          if grep -Eiq -- '-(rc|alpha|beta)' charts/webapp/Chart.lock; then
            echo "::error::webapp release depends on a prerelease chart"
            exit 1
          fi
