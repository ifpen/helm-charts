name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'charts/**'
      - 'docker/**'

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      charts_matrix: ${{ steps.detect.outputs.charts_matrix }}
      has_charts: ${{ steps.detect.outputs.has_charts }}
      images_matrix: ${{ steps.detect.outputs.images_matrix }}
      has_images: ${{ steps.detect.outputs.has_images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed charts and images
        id: detect
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"

          CHARTS_ITEMS="[]"
          while IFS= read -r chart; do
            NAME="$(echo "$chart" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["name"])')"
            FILTER="$(echo "$chart" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["path_filter"])')"
            CHART_PATH="$(echo "$chart" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["path"])')"
            PREFIX="${FILTER%%\**}"
            if echo "$CHANGED_FILES" | grep -q "^${PREFIX}"; then
              ITEM="$(python3 -c "import json; print(json.dumps({'name': '${NAME}', 'path': '${CHART_PATH}'}))")"
              CHARTS_ITEMS="$(python3 -c "import json; items=json.loads('${CHARTS_ITEMS}'); items.append(${ITEM}); print(json.dumps(items))")"
            fi
          done < <(cat .github/config/charts.json | python3 -c 'import json,sys; [print(json.dumps(i)) for i in json.load(sys.stdin)]')

          IMAGES_ITEMS="[]"
          while IFS= read -r image; do
            NAME="$(echo "$image" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["name"])')"
            FILTER="$(echo "$image" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["path_filter"])')"
            CONTEXT="$(echo "$image" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["context"])')"
            DOCKERFILE="$(echo "$image" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["dockerfile"])')"
            PREFIX="${FILTER%%\**}"
            if echo "$CHANGED_FILES" | grep -q "^${PREFIX}"; then
              ITEM="$(python3 -c "import json; print(json.dumps({'name': '${NAME}', 'context': '${CONTEXT}', 'dockerfile': '${DOCKERFILE}'}))")"
              IMAGES_ITEMS="$(python3 -c "import json; items=json.loads('${IMAGES_ITEMS}'); items.append(${ITEM}); print(json.dumps(items))")"
            fi
          done < <(cat .github/config/images.json | python3 -c 'import json,sys; [print(json.dumps(i)) for i in json.load(sys.stdin)]')

          CHARTS_MATRIX="$(python3 -c "import json; print(json.dumps({'include': json.loads('${CHARTS_ITEMS}')}))")"
          IMAGES_MATRIX="$(python3 -c "import json; print(json.dumps({'include': json.loads('${IMAGES_ITEMS}')}))")"

          {
            echo "charts_matrix=${CHARTS_MATRIX}"
            echo "images_matrix=${IMAGES_MATRIX}"
            echo "has_charts=$([[ "${CHARTS_ITEMS}" != "[]" ]] && echo true || echo false)"
            echo "has_images=$([[ "${IMAGES_ITEMS}" != "[]" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  lint-charts:
    needs: detect
    if: needs.detect.outputs.has_charts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.charts_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint ${{ matrix.path }}

      - name: Template Helm chart
        run: helm template ${{ matrix.path }}

  build-images:
    needs: detect
    if: needs.detect.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.images_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:buildcache
