name: RC Release on PR to main

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'charts/**'
      - 'docker/**'

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      charts_matrix: ${{ steps.detect.outputs.charts_matrix }}
      has_charts: ${{ steps.detect.outputs.has_charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect affected charts
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          export CHANGED_FILES

          python3 - <<'PY'
          import fnmatch
          import json
          import os

          changed = [line.strip() for line in os.getenv("CHANGED_FILES", "").splitlines() if line.strip()]

          with open('.github/config/charts.json', 'r', encoding='utf-8') as f:
              charts = json.load(f)
          with open('.github/config/images.json', 'r', encoding='utf-8') as f:
              images = json.load(f)

          image_map = {img['name']: img for img in images}

          changed_images = set()
          for image in images:
              pattern = image.get('path_filter', '')
              if any(fnmatch.fnmatch(path, pattern) for path in changed):
                  changed_images.add(image['name'])

          affected = []
          for chart in charts:
              chart_changed = any(fnmatch.fnmatch(path, chart.get('path_filter', '')) for path in changed)
              image_name = chart.get('image', '')
              docker_changed = image_name in changed_images
              if chart_changed or docker_changed:
                  row = dict(chart)
                  row['docker_changed'] = docker_changed
                  row['image_context'] = image_map.get(image_name, {}).get('context', '')
                  row['image_dockerfile'] = image_map.get(image_name, {}).get('dockerfile', '')
                  row['version_script'] = image_map.get(image_name, {}).get('version_script', '')
                  affected.append(row)

          matrix = json.dumps({'include': affected})
          has_charts = 'true' if affected else 'false'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"charts_matrix={matrix}\n")
              out.write(f"has_charts={has_charts}\n")
          PY

  rc:
    needs: detect
    if: needs.detect.outputs.has_charts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.charts_matrix) }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint ${{ matrix.path }}

      - name: Template Helm chart
        run: helm template ${{ matrix.path }}

      - name: Determine RC metadata
        id: rc
        run: |
          CHART_NAME="${{ matrix.name }}"
          CHART_PATH="${{ matrix.path }}"

          CHART_VERSION=$(grep '^version:' "$CHART_PATH/Chart.yaml" | awk '{print $2}')
          COMMITS_AHEAD=$(git rev-list --count origin/main..HEAD)
          RC_VERSION="${CHART_VERSION}-rc.${COMMITS_AHEAD}"

          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "rc_version=${RC_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${{ matrix.docker_changed }}" == "true" ]]; then
            VERSION_SCRIPT="${{ matrix.version_script }}"
            IMAGE_TAG_BASE=""

            if [[ -n "$VERSION_SCRIPT" && -f "$VERSION_SCRIPT" ]]; then
              while IFS= read -r line; do
                if [[ ! "$line" =~ ^[a-z_]+=[^=[:cntrl:]]+$ ]]; then
                  echo "::error::Invalid metadata from $VERSION_SCRIPT: $line"
                  exit 1
                fi
                key="${line%%=*}"
                value="${line#*=}"
                if [[ "$key" == "image_tag" ]]; then
                  if [[ ! "$value" =~ ^[A-Za-z0-9._-]+$ ]]; then
                    echo "::error::Invalid image_tag value from $VERSION_SCRIPT: $value"
                    exit 1
                  fi
                  IMAGE_TAG_BASE="$value"
                fi
              done < <(bash "$VERSION_SCRIPT" "${{ matrix.image_dockerfile }}")
            else
              IMAGE_VERSION=$(grep -E '^ARG [A-Za-z0-9_]+_VERSION=' "${{ matrix.image_dockerfile }}" | head -n 1 | cut -d'=' -f2 | tr -d '" ')
              IMAGE_TAG_BASE="$IMAGE_VERSION"
            fi

            if [[ -z "$IMAGE_TAG_BASE" ]]; then
              echo "::error::Unable to extract image tag base from ${{ matrix.image_dockerfile }}"
              exit 1
            fi

            RC_IMAGE_TAG="${IMAGE_TAG_BASE}-rc.${COMMITS_AHEAD}"
            RC_IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${RC_IMAGE_TAG}"
          else
            RC_IMAGE_TAG=""
            RC_IMAGE=""
          fi

          echo "rc_image_tag=${RC_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "rc_image=${RC_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: matrix.docker_changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker RC image
        if: matrix.docker_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image_context }}
          file: ${{ matrix.image_dockerfile }}
          push: true
          tags: ${{ steps.rc.outputs.rc_image }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max

      - name: Build RC Helm package
        run: |
          CHART_NAME="${{ matrix.name }}"
          CHART_PATH="${{ matrix.path }}"
          RC_VERSION="${{ steps.rc.outputs.rc_version }}"

          TMP_CHART_DIR="/tmp/${CHART_NAME}-rc"
          mkdir -p /tmp/helm-packages
          rm -rf "$TMP_CHART_DIR"
          cp -r "$CHART_PATH" "$TMP_CHART_DIR"

          sed -i -E "s/^version: .*/version: ${RC_VERSION}/" "$TMP_CHART_DIR/Chart.yaml"

          if [[ "${{ matrix.docker_changed }}" == "true" ]]; then
            awk -v new_tag="${{ steps.rc.outputs.rc_image_tag }}" '
              BEGIN {updated=0}
              !updated && /^  tag:/ {print "  tag: \"" new_tag "\""; updated=1; next}
              {print}
            ' "$TMP_CHART_DIR/values.yaml" > "$TMP_CHART_DIR/values.yaml.tmp" && mv "$TMP_CHART_DIR/values.yaml.tmp" "$TMP_CHART_DIR/values.yaml"
          fi

          helm package "$TMP_CHART_DIR" -d /tmp/helm-packages/

      - name: Create RC GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHART_NAME="${{ matrix.name }}"
          RC_VERSION="${{ steps.rc.outputs.rc_version }}"
          TAG="${CHART_NAME}-${RC_VERSION}"
          TGZ_FILE="/tmp/helm-packages/${CHART_NAME}-${RC_VERSION}.tgz"

          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          git push --delete origin "${TAG}" 2>/dev/null || true
          git tag -d "${TAG}" 2>/dev/null || true

          git tag "${TAG}"
          git push origin "${TAG}"

          NOTES_FILE=$(mktemp)
          {
            echo "## RC ${RC_VERSION}"
            echo ""
            echo "- Chart: ${CHART_NAME}"
            if [[ "${{ matrix.docker_changed }}" == "true" ]]; then
              echo "- Image RC: ${{ steps.rc.outputs.rc_image }}"
            fi
          } > "$NOTES_FILE"

          gh release create "${TAG}" "$TGZ_FILE" \
            --prerelease \
            --title "${TAG}" \
            --notes-file "$NOTES_FILE"

      - name: Update Helm repo index on gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHART_NAME="${{ matrix.name }}"
          RC_VERSION="${{ steps.rc.outputs.rc_version }}"
          TAG="${CHART_NAME}-${RC_VERSION}"

          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            /tmp/gh-pages

          mkdir -p /tmp/rc-index
          cp "/tmp/helm-packages/${CHART_NAME}-${RC_VERSION}.tgz" /tmp/rc-index/

          cd /tmp/gh-pages
          if [ -f index.yaml ]; then
            helm repo index /tmp/rc-index \
              --url "https://github.com/${{ github.repository }}/releases/download/${TAG}" \
              --merge index.yaml
          else
            helm repo index /tmp/rc-index \
              --url "https://github.com/${{ github.repository }}/releases/download/${TAG}"
          fi
          mv /tmp/rc-index/index.yaml index.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.yaml
          if git diff --cached --quiet; then
            echo "No index changes to commit"
            exit 0
          fi
          git commit -m "chore: publish RC ${RC_VERSION} for ${CHART_NAME}"
          git push
