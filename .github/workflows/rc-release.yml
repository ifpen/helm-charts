name: RC release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'charts/**'
      - 'docker/**'

concurrency:
  group: rc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed
          matrix="$(jq -c --rawfile changed /tmp/changed '
            ($changed | split("\n")) as $files |
            [.[] |
              .path as $path |
              (.path_filter | sub("/\\*\\*$"; "")) as $prefix |
              (any($files[]; startswith($prefix))) as $chart_changed |
              (if .image then
                $chart_changed or any($files[]; startswith("docker/" + .image + "/"))
              else false end) as $image_changed |
              select($chart_changed or $image_changed) |
              {chart_name: .name, chart_path: .path, image_changed: $image_changed}
            ]' .github/config/charts.json)"
          echo "matrix=$(jq -cn --argjson include "$matrix" '{include: $include}')" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect
    if: needs.detect.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - name: Build RC package
        id: package
        env:
          CHART_PATH: ${{ matrix.chart_path }}
          CHART_NAME: ${{ matrix.chart_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          version="$(awk '$1 == "version:" {print $2; exit}' "$CHART_PATH/Chart.yaml")"
          rc_version="${version}-rc.${PR_NUMBER}.${RUN_ATTEMPT}"
          work="/tmp/$CHART_NAME"
          cp -a "$CHART_PATH" "$work"
          sed -i "s/^version:.*/version: $rc_version/" "$work/Chart.yaml"
          if [ "$CHART_NAME" = filesender ] && [ "${{ matrix.image_changed }}" = true ]; then
            sed -i "0,/^  tag:.*/s//  tag: \"$rc_version\" # x-release-please-version/" "$work/values.yaml"
          fi
          helm dependency build "$work"
          mkdir -p /tmp/packages
          helm package "$work" --destination /tmp/packages
          echo "version=$rc_version" >> "$GITHUB_OUTPUT"
          echo "package=/tmp/packages/$CHART_NAME-$rc_version.tgz" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: matrix.chart_name == 'filesender' && matrix.image_changed
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push FileSender RC image
        if: matrix.chart_name == 'filesender' && matrix.image_changed
        uses: docker/build-push-action@v6
        with:
          context: docker/filesender
          file: docker/filesender/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/filesender:${{ steps.package.outputs.version }}

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          CHART_NAME: ${{ matrix.chart_name }}
          PACKAGE: ${{ steps.package.outputs.package }}
        run: |
          tag="$CHART_NAME-$VERSION"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$PACKAGE" --prerelease --title "$tag" --generate-notes

      - name: Update Helm index
        env:
          VERSION: ${{ steps.package.outputs.version }}
          CHART_NAME: ${{ matrix.chart_name }}
          PACKAGE: ${{ steps.package.outputs.package }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/gh-pages
          mkdir -p /tmp/index
          cp "$PACKAGE" /tmp/index/
          helm repo index /tmp/index \
            --url "https://github.com/${{ github.repository }}/releases/download/${CHART_NAME}-${VERSION}" \
            --merge /tmp/gh-pages/index.yaml
          python3 -m pip install --quiet pyyaml
          python3 - "$CHART_NAME" /tmp/index/index.yaml <<'PY'
          import sys
          import yaml

          chart = sys.argv[1]
          path = sys.argv[2]
          with open(path) as stream:
              index = yaml.safe_load(stream) or {}
          entries = index.get("entries", {}).get(chart, [])
          stable = [entry for entry in entries if "-rc." not in str(entry.get("version", ""))]
          rc = [entry for entry in entries if "-rc." in str(entry.get("version", ""))]
          rc.sort(key=lambda entry: entry.get("created", ""), reverse=True)
          index["entries"][chart] = stable + rc[:3]
          with open(path, "w") as stream:
              yaml.safe_dump(index, stream, sort_keys=False)
          PY
          cp /tmp/index/index.yaml /tmp/gh-pages/index.yaml
          cd /tmp/gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.yaml
          git commit -m "chore: publish ${CHART_NAME} ${VERSION} RC" || true
          git push

      - name: Keep the three latest RCs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_NAME: ${{ matrix.chart_name }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease) | select(.tagName | startswith(\"${CHART_NAME}-\"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName" |
            while read -r tag; do [ -z "$tag" ] || gh release delete "$tag" --yes --cleanup-tag; done

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.package.outputs.version }}
          CHART_NAME: ${{ matrix.chart_name }}
        with:
          script: |
            const marker = `RC publiée — ${process.env.CHART_NAME}`;
            const body = `## ${marker}\n\n` +
              `Version : \`${process.env.VERSION}\`\n\n` +
              '```bash\n' +
              `helm repo update ifpen\nhelm install ${process.env.CHART_NAME}-rc ifpen/${process.env.CHART_NAME} ` +
              `--version ${process.env.VERSION} --devel\n` +
              '```';
            const {data} = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const old = data.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: old.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body
              });
            }
