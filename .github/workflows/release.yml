name: Publish chart release

on:
  workflow_call:
    inputs:
      chart_path:
        required: true
        type: string
    secrets:
      token:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - name: Read chart metadata
        id: metadata
        env:
          CHART_PATH: ${{ inputs.chart_path }}
        run: |
          echo "chart_name=$(basename "$CHART_PATH")" >> "$GITHUB_OUTPUT"
          echo "version=$(awk '$1 == "version:" {print $2; exit}' "$CHART_PATH/Chart.yaml")" >> "$GITHUB_OUTPUT"
      - name: Build dependencies and package
        env:
          CHART_PATH: ${{ inputs.chart_path }}
        run: |
          helm dependency build "$CHART_PATH"
          if grep -Eiq -- '-(rc|alpha|beta)' "$CHART_PATH/Chart.lock" 2>/dev/null; then
            echo "::error::Chart.lock contains a prerelease dependency"
            exit 1
          fi
          mkdir -p /tmp/packages
          helm package "$CHART_PATH" --destination /tmp/packages
      - name: Log in to GHCR
        if: inputs.chart_path == 'charts/filesender'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token }}
      - name: Build and publish FileSender image
        if: inputs.chart_path == 'charts/filesender'
        uses: docker/build-push-action@v6
        with:
          context: docker/filesender
          file: docker/filesender/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/filesender:${{ steps.metadata.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/filesender:latest
      - name: Attach package to release
        env:
          GH_TOKEN: ${{ secrets.token }}
          CHART_NAME: ${{ steps.metadata.outputs.chart_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: gh release upload "$CHART_NAME-$VERSION" "/tmp/packages/$CHART_NAME-$VERSION.tgz" --clobber
      - name: Publish Helm index
        env:
          GH_TOKEN: ${{ secrets.token }}
          CHART_NAME: ${{ steps.metadata.outputs.chart_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/gh-pages
          mkdir -p /tmp/index
          cp "/tmp/packages/$CHART_NAME-$VERSION.tgz" /tmp/index/
          helm repo index /tmp/index \
            --url "https://github.com/${{ github.repository }}/releases/download/$CHART_NAME-$VERSION" \
            --merge /tmp/gh-pages/index.yaml
          cp /tmp/index/index.yaml /tmp/gh-pages/index.yaml
          cd /tmp/gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.yaml
          git commit -m "chore: publish $CHART_NAME $VERSION" || true
          git push
      - name: Purge prereleases for this chart
        env:
          GH_TOKEN: ${{ secrets.token }}
          CHART_NAME: ${{ steps.metadata.outputs.chart_name }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq "[.[] | select(.isPrerelease) | select(.tagName | startswith(\"${CHART_NAME}-\"))] | .[].tagName" |
            while read -r tag; do [ -z "$tag" ] || gh release delete "$tag" --yes --cleanup-tag; done
