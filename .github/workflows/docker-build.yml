name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docker/**'

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_images: ${{ steps.detect.outputs.has_images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changed images
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --name-only --pretty='' HEAD)
          export CHANGED_FILES

          python3 - <<'PY'
          import fnmatch
          import json
          import os

          changed = [line.strip() for line in os.getenv("CHANGED_FILES", "").splitlines() if line.strip()]
          with open('.github/config/images.json', 'r', encoding='utf-8') as f:
              images = json.load(f)

          selected = []
          for image in images:
              pattern = image.get('path_filter', '')
              if any(fnmatch.fnmatch(path, pattern) for path in changed):
                  selected.append(image)

          matrix = json.dumps({'include': selected})
          has_images = 'true' if selected else 'false'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"matrix={matrix}\n")
              out.write(f"has_images={has_images}\n")
          PY

  build:
    needs: detect
    if: needs.detect.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: vars
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          DOCKERFILE="${{ matrix.dockerfile }}"

          FILESENDER_VERSION=$(grep -E '^ARG FILESENDER_VERSION=' "$DOCKERFILE" | head -n 1 | cut -d'=' -f2 | tr -d '" ')
          if [[ -z "$FILESENDER_VERSION" ]]; then
            echo "::error::Unable to extract FILESENDER_VERSION from $DOCKERFILE"
            exit 1
          fi

          CHART_PATH=$(python3 - <<'PY'
          import json
          import os
          image = os.environ['IMAGE_NAME']
          with open('.github/config/charts.json', 'r', encoding='utf-8') as f:
              charts = json.load(f)
          linked = next((c for c in charts if c.get('image') == image), None)
          print(linked.get('path') if linked else '')
          PY
          )

          if [[ "${{ github.ref_name }}" == "develop" ]]; then
            SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
            IMAGE_TAG="develop-${SHA_SHORT}-$(date +%Y%m%d%H%M%S)"
            IMAGE_TAGS="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${IMAGE_TAG}"
          else
            if [[ -z "$CHART_PATH" ]]; then
              echo "::error::No chart linked to image $IMAGE_NAME in .github/config/charts.json"
              exit 1
            fi

            CURRENT_VERSION=$(grep '^version:' "$CHART_PATH/Chart.yaml" | awk '{print $2}')
            if [[ "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              IMAGE_TAG="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              echo "::error::Chart version '$CURRENT_VERSION' is not in x.y.z format"
              exit 1
            fi
            IMAGE_TAGS="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${IMAGE_TAG}\nghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest"
          fi

          {
            echo "filesender_version=$FILESENDER_VERSION"
            echo "chart_path=$CHART_PATH"
            echo "image_tag=$IMAGE_TAG"
            echo "image_tags<<EOF"
            echo -e "$IMAGE_TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.vars.outputs.image_tags }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:buildcache,mode=max

      - name: Update linked chart
        run: |
          IMAGE_NAME="${{ matrix.name }}"
          IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
          APP_VERSION="${{ steps.vars.outputs.filesender_version }}"
          CHART_PATH="${{ steps.vars.outputs.chart_path }}"

          if [[ -z "$CHART_PATH" ]]; then
            echo "No chart linked to image ${{ matrix.name }}"
            exit 0
          fi

          CHART_FILE="$CHART_PATH/Chart.yaml"
          VALUES_FILE="$CHART_PATH/values.yaml"

          sed -i -E "s/^appVersion: .*/appVersion: \"${APP_VERSION}\"/" "$CHART_FILE"
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            sed -i -E "s/^version: .*/version: ${IMAGE_TAG}/" "$CHART_FILE"
          fi

          awk -v new_tag="$IMAGE_TAG" '
            BEGIN {updated=0}
            !updated && /^  tag:/ {print "  tag: \"" new_tag "\""; updated=1; next}
            {print}
          ' "$VALUES_FILE" > "$VALUES_FILE.tmp" && mv "$VALUES_FILE.tmp" "$VALUES_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CHART_FILE" "$VALUES_FILE"

          if git diff --cached --quiet; then
            echo "No chart changes to commit"
            exit 0
          fi

          git commit -m "chore: update ${IMAGE_NAME} to ${IMAGE_TAG} [skip ci]"
          git push origin "${{ github.ref_name }}"
