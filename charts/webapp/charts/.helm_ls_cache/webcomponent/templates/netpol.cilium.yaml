---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "webcomponent.fullname" . }}-allow-all-in-own-ns
  labels:
    {{- include "webcomponent.labels" . | nindent 4 }}
spec:
  # 2. Autoriser l'ingress uniquement depuis CE même namespace
  ingress:
    - fromEndpoints:
      - matchLabels:
        io.kubernetes.pod.namespace: {{ .Release.Namespace }}

  # 3. Autoriser l'egress uniquement vers CE même namespace
  egress:
    - toEndpoints:
      - matchLabels:
        io.kubernetes.pod.namespace: {{ .Release.Namespace }}
